<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entity Manager - VKP API</title>
  <link rel="stylesheet" href="/js/admin-common.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="user-info-bar" id="user-info-bar" style="display: none;">
        <div>
          <div class="user-name" id="user-display-name">Loading...</div>
          <div class="user-role" id="user-role">...</div>
        </div>
        <button class="logout-btn" type="button" id="logout-btn">Logout</button>
      </div>
      <h1>Entity Manager</h1>
      <p>JSON files in S3. Unreadable objects stay as flagged rows.</p>
    </header>
    <div class="content">
      <div class="nav-links">
        <a href="/aval/">Hub</a>
        <a href="/entities/" class="active">Files</a>
        <a href="/users/">Users</a>
        <a href="/games/">Games</a>
      </div>
      <div id="alert-container"></div>
      <div class="tabs">
        <div class="tab active" data-tab="browse">Browse</div>
        <div class="tab" data-tab="create">Create</div>
      </div>

      <div class="tab-content active workspace" data-content="browse">
        <div class="filters">
          <div class="form-group">
            <label for="search-prefix">ID prefix</label>
            <input id="search-prefix" type="text" placeholder="e.g. game-">
          </div>
          <button class="btn" type="button" id="refresh-btn">Refresh</button>
        </div>
        <div class="split">
          <div class="split-left">
            <div class="pane-title">Files</div>
            <div id="table-wrap" class="pane-body"></div>
            <div class="pager">
              <span class="page-label" id="page-label">Page 1</span>
              <button class="btn btn-secondary btn-small" type="button" id="prev-page" disabled>Previous</button>
              <button class="btn btn-secondary btn-small" type="button" id="next-page" disabled>Next</button>
            </div>
          </div>
          <div class="split-right">
            <div class="pane-title">Details</div>
            <div id="detail-panel" class="pane-body">
              <div class="empty-detail">Select a file in the list.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content" data-content="create">
        <div class="section-title">Create file</div>
        <form id="create-form">
          <div class="form-group">
            <label for="create-id">ID <code>^[a-zA-Z0-9._-]{1,128}$</code></label>
            <input id="create-id" required pattern="^[a-zA-Z0-9._-]{1,128}$">
          </div>
          <div class="form-group">
            <label for="create-data">JSON data</label>
            <textarea id="create-data" required>{ }</textarea>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/admin-common.js"></script>
  <script>
    const A = window.Admin;
    const app = {
      rows: [],
      selectedId: null,
      selected: null,
      cursors: [undefined],
      pageIndex: 0,
      nextCursor: undefined,

      async load(direction) {
        const wrap = document.getElementById('table-wrap');
        A.setLoading(wrap, 'Loading files...');
        try {
          const prefix = document.getElementById('search-prefix').value.trim();
          const params = new URLSearchParams({ limit: String(A.PAGE_SIZE) });
          if (prefix) params.set('prefix', prefix);
          if (direction === 'next' && this.nextCursor) {
            this.pageIndex += 1;
            this.cursors[this.pageIndex] = this.nextCursor;
          } else if (direction === 'prev') {
            this.pageIndex = Math.max(0, this.pageIndex - 1);
          } else if (direction !== 'page') {
            this.pageIndex = 0;
            this.cursors = [undefined];
          }
          const cursor = this.cursors[this.pageIndex];
          if (cursor) params.set('cursor', cursor);
          const listed = await A.request('GET', `/files?${params}`);
          if (!listed.ok) {
            wrap.replaceChildren();
            wrap.appendChild(alertNode('error', listed.error));
            A.setPager({ pageIndex: this.pageIndex, nextCursor: undefined });
            return;
          }
          const ids = A.listNames(listed.data);
          this.nextCursor = A.nextCursorOf(listed.data);
          A.setPager({ pageIndex: this.pageIndex, nextCursor: this.nextCursor });
          this.rows = await A.mapPool(ids, 8, async (id) => {
            const meta = await A.request('GET', `/files/${A.pathId(id)}/meta`);
            if (!meta.ok) {
              return { id: A.asString(id), unreadable: true, error: meta.error, size: null, lastModified: null, etag: null };
            }
            const data = A.asObject(meta.data);
            return {
              id: A.asString(id),
              unreadable: false,
              size: A.asNumber(data.size),
              lastModified: data.lastModified,
              etag: A.asString(data.etag)
            };
          });
          this.renderTable();
        } catch (error) {
          wrap.replaceChildren();
          wrap.appendChild(alertNode('error', error.message || String(error)));
        }
      },

      renderTable() {
        A.mountTable(document.getElementById('table-wrap'), {
          empty: 'No files found.',
          selectedKey: this.selectedId,
          getKey: (row) => row.id,
          onSelect: (row) => this.open(row.id),
          columns: [
            { title: 'ID', render: (row) => row.id },
            { title: 'Status', render: (row) => row.unreadable ? A.badge('unreadable', 'bad') : A.badge('ok', 'ok') }
          ],
          rows: this.rows
        });
      },

      async open(id) {
        this.selectedId = id;
        this.renderTable();
        const panel = document.getElementById('detail-panel');
        A.setLoading(panel, 'Loading file...');
        try {
          const result = await A.request('GET', `/files/${A.pathId(id)}`);
          const payload = result.ok ? A.filePayload(result.data) : { id, data: result.rawText || result.error };
          this.selected = {
            id,
            etag: result.etag,
            readable: result.ok && !result.parseError,
            data: payload.data,
            rawText: result.ok ? A.prettyJson(payload.data) : (result.rawText || result.error)
          };
          panel.replaceChildren();
          const box = document.createElement('div');
          box.className = 'detail';
          const title = document.createElement('h3');
          title.textContent = id;
          box.appendChild(title);
          if (!this.selected.readable) {
            const warn = document.createElement('div');
            warn.className = 'warn';
            warn.textContent = 'This object could not be parsed as JSON. You can still delete it. Save is disabled until the body is valid JSON.';
            box.appendChild(warn);
          }
          const etag = document.createElement('p');
          etag.className = 'muted';
          etag.textContent = `ETag: ${this.selected.etag || '—'}`;
          box.appendChild(etag);
          const label = document.createElement('label');
          label.textContent = 'Stored JSON (PUT/PATCH body is this value)';
          const ta = document.createElement('textarea');
          ta.id = 'edit-data';
          ta.value = this.selected.readable ? this.selected.rawText : A.asString(this.selected.rawText);
          box.appendChild(label);
          const group = document.createElement('div');
          group.className = 'form-group';
          group.appendChild(ta);
          box.appendChild(group);
          const modeGroup = document.createElement('div');
          modeGroup.className = 'form-group';
          modeGroup.innerHTML = '<label for="update-mode">Save mode</label>';
          const select = document.createElement('select');
          select.id = 'update-mode';
          select.innerHTML = '<option value="replace">Replace (PUT)</option><option value="merge">Merge (PATCH)</option>';
          modeGroup.appendChild(select);
          box.appendChild(modeGroup);
          const actions = document.createElement('div');
          actions.className = 'form-actions';
          const save = document.createElement('button');
          save.className = 'btn';
          save.type = 'button';
          save.textContent = 'Save';
          save.addEventListener('click', () => this.save());
          const del = document.createElement('button');
          del.className = 'btn btn-danger';
          del.type = 'button';
          del.textContent = 'Delete';
          del.addEventListener('click', () => this.remove());
          actions.appendChild(save);
          actions.appendChild(del);
          box.appendChild(actions);
          panel.appendChild(box);
        } catch (error) {
          panel.replaceChildren();
          panel.appendChild(alertNode('error', error.message || String(error)));
        }
      },

      async save() {
        const parsed = A.parseJsonText(document.getElementById('edit-data').value);
        if (!parsed.ok) {
          A.showAlert('Body is not valid JSON: ' + parsed.error, 'error');
          return;
        }
        const mode = document.getElementById('update-mode').value;
        const method = mode === 'merge' ? 'PATCH' : 'PUT';
        const headers = {};
        if (this.selected && this.selected.etag) headers['If-Match'] = this.selected.etag;
        const result = await A.request(method, `/files/${A.pathId(this.selectedId)}`, parsed.value, headers);
        if (!result.ok) {
          A.showAlert(result.error, 'error');
          return;
        }
        A.showAlert('File saved', 'success');
        await this.load('page');
        await this.open(this.selectedId);
      },

      async remove() {
        if (!confirm(`Delete file "${this.selectedId}"?`)) return;
        const headers = {};
        if (this.selected && this.selected.etag) headers['If-Match'] = this.selected.etag;
        const result = await A.request('DELETE', `/files/${A.pathId(this.selectedId)}`, null, headers);
        if (!result.ok) {
          A.showAlert(result.error, 'error');
          return;
        }
        A.showAlert('File deleted', 'success');
        this.selectedId = null;
        A.showEmptyDetail(document.getElementById('detail-panel'), 'Select a file in the list.');
        await this.load('page');
      },

      async create(event) {
        event.preventDefault();
        const id = document.getElementById('create-id').value.trim();
        const parsed = A.parseJsonText(document.getElementById('create-data').value);
        if (!parsed.ok) {
          A.showAlert('JSON data is invalid: ' + parsed.error, 'error');
          return;
        }
        const result = await A.request('POST', '/files', { id, data: parsed.value });
        if (!result.ok) {
          A.showAlert(result.error, 'error');
          return;
        }
        A.showAlert('File created', 'success');
        event.target.reset();
        A.switchTab('browse');
        await this.load();
        await this.open(id);
      }
    };

    function alertNode(type, message) {
      const el = document.createElement('div');
      el.className = `alert alert-${type}`;
      el.textContent = message;
      return el;
    }

    if (A.initAuth()) {
      A.bindTabs();
      document.getElementById('logout-btn').addEventListener('click', A.logout);
      document.getElementById('refresh-btn').addEventListener('click', () => app.load());
      document.getElementById('prev-page').addEventListener('click', () => app.load('prev'));
      document.getElementById('next-page').addEventListener('click', () => app.load('next'));
      document.getElementById('create-form').addEventListener('submit', (e) => app.create(e));
      app.load();
    }
  </script>
</body>
</html>
