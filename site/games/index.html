<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Manager - VKP API</title>
  <link rel="stylesheet" href="/js/admin-common.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="user-info-bar" id="user-info-bar" style="display: none;">
        <div>
          <div class="user-name" id="user-display-name">Loading...</div>
          <div class="user-role" id="user-role">...</div>
        </div>
        <button class="logout-btn" type="button" id="logout-btn">Logout</button>
      </div>
      <h1>Game Manager</h1>
      <p>Games table. Legacy or invalid JSON is flagged; listing other games still works.</p>
    </header>
    <div class="content">
      <div class="nav-links">
        <a href="/aval/">Hub</a>
        <a href="/entities/">Files</a>
        <a href="/users/">Users</a>
        <a href="/games/" class="active">Games</a>
      </div>
      <div id="alert-container"></div>
      <div class="tabs">
        <div class="tab active" data-tab="browse">Browse</div>
        <div class="tab" data-tab="create">Create</div>
      </div>

      <div class="tab-content active workspace" data-content="browse">
        <div class="filters">
          <div class="form-group">
            <label for="search-prefix">ID prefix</label>
            <input id="search-prefix" type="text" placeholder="e.g. game-">
          </div>
          <button class="btn" type="button" id="refresh-btn">Refresh</button>
        </div>
        <div class="split">
          <div class="split-left">
            <div class="pane-title">Games</div>
            <div id="table-wrap" class="pane-body"></div>
            <div class="pager">
              <span class="page-label" id="page-label">Page 1</span>
              <button class="btn btn-secondary btn-small" type="button" id="prev-page" disabled>Previous</button>
              <button class="btn btn-secondary btn-small" type="button" id="next-page" disabled>Next</button>
            </div>
          </div>
          <div class="split-right">
            <div class="pane-title">Details</div>
            <div id="detail-panel" class="pane-body">
              <div class="empty-detail">Select a game in the list.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-content" data-content="create">
        <div class="section-title">Create game</div>
        <form id="create-form">
          <div class="form-group">
            <label for="create-id">Game ID</label>
            <input id="create-id" required pattern="^[a-zA-Z0-9._-]{1,128}$">
          </div>
          <div class="form-group">
            <label for="new-user-id">Players</label>
            <div class="filters">
              <input id="new-user-id" type="text" placeholder="Cognito sub or user id">
              <button class="btn btn-secondary" type="button" id="add-player-btn">Add player</button>
            </div>
            <div id="create-players" class="tag-list"></div>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Create</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="/js/admin-common.js"></script>
  <script>
    const A = window.Admin;
    const app = {
      rows: [],
      selectedId: null,
      selected: null,
      createPlayers: [],
      cursors: [undefined],
      pageIndex: 0,
      nextCursor: undefined,

      async load(direction) {
        const wrap = document.getElementById('table-wrap');
        A.setLoading(wrap, 'Loading games...');
        try {
          const prefix = document.getElementById('search-prefix').value.trim();
          const params = new URLSearchParams({ limit: String(A.PAGE_SIZE) });
          if (prefix) params.set('prefix', prefix);
          if (direction === 'next' && this.nextCursor) {
            this.pageIndex += 1;
            this.cursors[this.pageIndex] = this.nextCursor;
          } else if (direction === 'prev') {
            this.pageIndex = Math.max(0, this.pageIndex - 1);
          } else if (direction !== 'page') {
            this.pageIndex = 0;
            this.cursors = [undefined];
          }
          const cursor = this.cursors[this.pageIndex];
          if (cursor) params.set('cursor', cursor);
          const listed = await A.request('GET', `/games?${params}`);
          if (!listed.ok) {
            wrap.replaceChildren();
            const err = document.createElement('div');
            err.className = 'alert alert-error';
            err.textContent = listed.error;
            wrap.appendChild(err);
            A.setPager({ pageIndex: this.pageIndex, nextCursor: undefined });
            return;
          }
          this.nextCursor = A.nextCursorOf(listed.data);
          A.setPager({ pageIndex: this.pageIndex, nextCursor: this.nextCursor });
          this.rows = A.listNames(listed.data).map((id) => ({ id: A.asString(id) }));
          this.renderTable();
        } catch (error) {
          wrap.replaceChildren();
          const err = document.createElement('div');
          err.className = 'alert alert-error';
          err.textContent = error.message || String(error);
          wrap.appendChild(err);
        }
      },

      renderTable() {
        A.mountTable(document.getElementById('table-wrap'), {
          empty: 'No games found.',
          selectedKey: this.selectedId,
          getKey: (row) => row.id,
          onSelect: (row) => this.open(row.id),
          columns: [
            { title: 'ID', render: (row) => row.id }
          ],
          rows: this.rows
        });
      },

      async open(id) {
        this.selectedId = id;
        this.renderTable();
        const panel = document.getElementById('detail-panel');
        A.setLoading(panel, 'Loading game...');
        try {
          const got = await A.request('GET', `/games/${A.pathId(id)}`);
          const game = got.ok ? A.normalizeGame(id, got.data) : {
            id, unreadable: true, error: got.error, usersIds: [], rounds: [], status: 'unreadable', raw: got.rawText
          };
          game.etag = got.etag || game.etag;
          this.selected = game;
          this.renderDetail(panel, game, got);
        } catch (error) {
          panel.replaceChildren();
          const err = document.createElement('div');
          err.className = 'alert alert-error';
          err.textContent = error.message || String(error);
          panel.appendChild(err);
        }
      },

      renderDetail(panel, game, got) {
        panel.replaceChildren();
        const box = document.createElement('div');
        box.className = 'detail';
        const h = document.createElement('h3');
        h.textContent = game.id;
        box.appendChild(h);

        if (game.unreadable) {
          const warn = document.createElement('div');
          warn.className = 'warn';
          warn.textContent = 'This game could not be loaded as a current Game entity. Listing other games is unaffected. Delete is still available.';
          box.appendChild(warn);
          const pre = document.createElement('pre');
          pre.className = 'raw-box';
          pre.textContent = got && got.rawText ? got.rawText : A.asString(game.error);
          box.appendChild(pre);
        } else {
          if (A.asArray(game.warnings).length) {
            const warn = document.createElement('div');
            warn.className = 'warn';
            warn.textContent = 'Normalized non-standard fields: ' + game.warnings.join('; ');
            box.appendChild(warn);
          }
          const dl = document.createElement('dl');
          dl.className = 'detail-grid';
          appendDl(dl, 'Status', game.status + (game.isFinished ? ' (finished)' : ''));
          appendDl(dl, 'Players', A.asArray(game.usersIds).join(', ') || '—');
          appendDl(dl, 'Rounds', String(A.asArray(game.rounds).length));
          appendDl(dl, 'ETag', game.etag || '—');
          box.appendChild(dl);

          const rh = document.createElement('h3');
          rh.textContent = 'Rounds';
          box.appendChild(rh);
          const roundsWrap = document.createElement('div');
          box.appendChild(roundsWrap);
          A.mountTable(roundsWrap, {
            empty: 'No rounds (or rounds field was missing).',
            columns: [
              { title: 'ID', render: (r) => r.id },
              { title: 'Status', render: (r) => r.isFinished ? 'finished' : r.status },
              { title: 'Moves', render: (r) => A.asArray(r.moves).map((m) => `${m.userId}:${m.moveType}`).join(', ') || '—' }
            ],
            rows: A.asArray(game.rounds),
            getKey: (r) => r.id
          });

          const manage = document.createElement('h3');
          manage.textContent = 'Manage';
          box.appendChild(manage);
          box.appendChild(this.manageForm(game));
        }

        const rawH = document.createElement('h3');
        rawH.textContent = 'Raw JSON';
        const pre = document.createElement('pre');
        pre.className = 'raw-box';
        pre.textContent = got && got.ok ? A.prettyJson(got.data) : A.asString(got && got.rawText);
        box.appendChild(rawH);
        box.appendChild(pre);

        const actions = document.createElement('div');
        actions.className = 'form-actions';
        if (!game.unreadable) {
          const finish = document.createElement('button');
          finish.className = 'btn btn-success';
          finish.type = 'button';
          finish.textContent = 'Finish game';
          finish.addEventListener('click', () => this.finishGame());
          actions.appendChild(finish);
        }
        const del = document.createElement('button');
        del.className = 'btn btn-danger';
        del.type = 'button';
        del.textContent = 'Delete game';
        del.addEventListener('click', () => this.remove());
        actions.appendChild(del);
        box.appendChild(actions);
        panel.appendChild(box);
      },

      manageForm(game) {
        const wrap = document.createElement('div');
        const roundIds = A.asArray(game.rounds).map((r) => r.id).filter(Boolean);
        wrap.innerHTML = `
          <div class="form-row">
            <div class="form-group">
              <label for="new-round-id">New round ID</label>
              <input id="new-round-id" type="text">
            </div>
            <div class="form-group">
              <label>&nbsp;</label>
              <button class="btn btn-secondary" type="button" id="add-round-btn">Add round</button>
            </div>
          </div>
          <div class="form-row-3">
            <div class="form-group">
              <label for="move-round-id">Round</label>
              <select id="move-round-id"></select>
            </div>
            <div class="form-group">
              <label for="move-user-id">User id</label>
              <input id="move-user-id" type="text">
            </div>
            <div class="form-group">
              <label for="move-type">Move</label>
              <select id="move-type">
                <option>Stone</option>
                <option>Paper</option>
                <option>Scissors</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="move-size">Size</label>
              <input id="move-size" type="number" min="0" value="0">
            </div>
            <div class="form-group">
              <label for="move-decor">Decor ID</label>
              <input id="move-decor" type="number" min="0" value="0">
            </div>
          </div>
          <div class="form-actions">
            <button class="btn" type="button" id="add-move-btn">Add move</button>
            <button class="btn btn-secondary" type="button" id="finish-round-btn">Finish selected round</button>
          </div>
        `;
        const select = wrap.querySelector('#move-round-id');
        roundIds.forEach((rid) => {
          const opt = document.createElement('option');
          opt.value = rid;
          opt.textContent = rid;
          select.appendChild(opt);
        });
        wrap.querySelector('#add-round-btn').addEventListener('click', () => this.addRound());
        wrap.querySelector('#add-move-btn').addEventListener('click', () => this.addMove());
        wrap.querySelector('#finish-round-btn').addEventListener('click', () => this.finishRound());
        return wrap;
      },

      renderCreatePlayers() {
        const el = document.getElementById('create-players');
        el.replaceChildren();
        this.createPlayers.forEach((id) => {
          const tag = document.createElement('span');
          tag.className = 'tag';
          tag.textContent = id + ' ';
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = '×';
          btn.addEventListener('click', () => {
            this.createPlayers = this.createPlayers.filter((x) => x !== id);
            this.renderCreatePlayers();
          });
          tag.appendChild(btn);
          el.appendChild(tag);
        });
      },

      addCreatePlayer() {
        const input = document.getElementById('new-user-id');
        const id = input.value.trim();
        if (!id) return;
        if (!this.createPlayers.includes(id)) this.createPlayers.push(id);
        input.value = '';
        this.renderCreatePlayers();
      },

      async create(event) {
        event.preventDefault();
        const id = document.getElementById('create-id').value.trim();
        if (this.createPlayers.length === 0) {
          A.showAlert('Add at least one player id', 'error');
          return;
        }
        const result = await A.request('POST', '/games', {
          id,
          usersIds: this.createPlayers,
          rounds: [],
          isFinished: false
        });
        if (!result.ok) {
          A.showAlert(result.error, 'error');
          return;
        }
        A.showAlert('Game created', 'success');
        event.target.reset();
        this.createPlayers = [];
        this.renderCreatePlayers();
        A.switchTab('browse');
        await this.load();
        await this.open(id);
      },

      ifMatchHeaders() {
        const headers = {};
        if (this.selected && this.selected.etag) headers['If-Match'] = this.selected.etag;
        return headers;
      },

      async addRound() {
        const roundId = document.getElementById('new-round-id').value.trim();
        if (!roundId || !this.selectedId) return;
        const result = await A.request('POST', `/games/${A.pathId(this.selectedId)}/rounds`, {
          id: roundId,
          moves: [],
          isFinished: false
        }, this.ifMatchHeaders());
        if (!result.ok) { A.showAlert(result.error, 'error'); return; }
        A.showAlert('Round added', 'success');
        await this.open(this.selectedId);
      },

      async addMove() {
        const roundId = document.getElementById('move-round-id').value;
        const userId = document.getElementById('move-user-id').value.trim();
        if (!roundId || !userId || !this.selectedId) {
          A.showAlert('Round and user id are required', 'error');
          return;
        }
        const result = await A.request(
          'POST',
          `/games/${A.pathId(this.selectedId)}/rounds/${A.pathId(roundId)}/moves`,
          {
            userId,
            context: {
              moveType: document.getElementById('move-type').value,
              size: A.asNumber(document.getElementById('move-size').value, 0),
              decorId: A.asNumber(document.getElementById('move-decor').value, 0)
            }
          },
          this.ifMatchHeaders()
        );
        if (!result.ok) { A.showAlert(result.error, 'error'); return; }
        A.showAlert('Move added', 'success');
        await this.open(this.selectedId);
      },

      async finishRound() {
        const roundId = document.getElementById('move-round-id').value;
        if (!roundId || !this.selectedId) return;
        const result = await A.request(
          'PATCH',
          `/games/${A.pathId(this.selectedId)}/rounds/${A.pathId(roundId)}/finish`,
          {},
          this.ifMatchHeaders()
        );
        if (!result.ok) { A.showAlert(result.error, 'error'); return; }
        A.showAlert('Round finished', 'success');
        await this.open(this.selectedId);
      },

      async finishGame() {
        if (!this.selectedId) return;
        const result = await A.request('PATCH', `/games/${A.pathId(this.selectedId)}/finish`, {}, this.ifMatchHeaders());
        if (!result.ok) { A.showAlert(result.error, 'error'); return; }
        A.showAlert('Game finished', 'success');
        await this.open(this.selectedId);
      },

      async remove() {
        if (!this.selectedId) return;
        if (!confirm(`Delete game "${this.selectedId}"?`)) return;
        const result = await A.request('DELETE', `/games/${A.pathId(this.selectedId)}`, null, this.ifMatchHeaders());
        if (!result.ok) { A.showAlert(result.error, 'error'); return; }
        A.showAlert('Game deleted', 'success');
        this.selectedId = null;
        A.showEmptyDetail(document.getElementById('detail-panel'), 'Select a game in the list.');
        await this.load('page');
      }
    };

    function appendDl(dl, dtText, ddText) {
      const wrap = document.createElement('div');
      const dt = document.createElement('dt');
      dt.textContent = dtText;
      const dd = document.createElement('dd');
      dd.textContent = ddText;
      wrap.appendChild(dt);
      wrap.appendChild(dd);
      dl.appendChild(wrap);
    }

    if (A.initAuth()) {
      A.bindTabs();
      document.getElementById('logout-btn').addEventListener('click', A.logout);
      document.getElementById('refresh-btn').addEventListener('click', () => app.load());
      document.getElementById('prev-page').addEventListener('click', () => app.load('prev'));
      document.getElementById('next-page').addEventListener('click', () => app.load('next'));
      document.getElementById('add-player-btn').addEventListener('click', () => app.addCreatePlayer());
      document.getElementById('create-form').addEventListener('submit', (e) => app.create(e));
      app.load();
    }
  </script>
</body>
</html>
